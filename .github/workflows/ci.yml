name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      # Deliberately not run here: `npm run bee:check`, `npm run loops:check`,
      # or `npm run loops:correlate`. They require a real,
      # locally authenticated Bee CLI session and is documented as a manual
      # step for the repository owner (see docs/BEE_INTEGRATION.md) — CI
      # never authenticates to Bee, accesses a real account, or holds any
      # Bee credential. Every step above uses synthetic fixtures only.
