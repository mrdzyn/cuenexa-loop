<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">CueNexa Loop architecture flow</title>
  <desc id="desc">Animated architecture showing Bee data flowing through the CueNexa adapter, deterministic engine, local LoopStore, review interface, and a separate memory-only realtime provisional path.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="auth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="prov" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .label{font:600 20px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .sub{font:500 14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
      .small{font:600 12px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1;letter-spacing:.12em}
      .box{fill:#0f172a;stroke:#334155;stroke-width:1.5}
      .authLine{fill:none;stroke:url(#auth);stroke-width:5;stroke-linecap:round}
      .provLine{fill:none;stroke:url(#prov);stroke-width:4;stroke-linecap:round;stroke-dasharray:10 13}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
      .float{animation:float 3s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="1400" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1160" cy="40" r="220" fill="#0ea5e9" opacity=".05"/>
  <circle cx="210" cy="500" r="260" fill="#7c3aed" opacity=".06"/>

  <text x="70" y="62" class="small">AUTHORITATIVE HISTORY</text>
  <text x="70" y="92" class="sub">Processed Bee history is the only persistence authority</text>

  <path id="authPath" class="authLine" d="M190 205 H1210"/>
  <path id="provPath" class="provLine" d="M190 390 H985"/>

  <!-- Bee -->
  <g transform="translate(85 145)" filter="url(#soft)" class="float">
    <rect class="box" width="210" height="120" rx="22"/>
    <circle cx="42" cy="42" r="20" fill="#0ea5e9" opacity=".18"/>
    <path d="M32 42c8-14 21-14 29 0-8 14-21 14-29 0Z" fill="#38bdf8"/>
    <circle cx="42" cy="42" r="5" fill="#e0f2fe"/>
    <text x="75" y="48" class="label">Bee</text>
    <text x="26" y="84" class="sub">processed history</text>
  </g>

  <!-- Adapter -->
  <g transform="translate(330 145)" filter="url(#soft)">
    <rect class="box" width="220" height="120" rx="22"/>
    <circle cx="44" cy="42" r="21" fill="#38bdf8" opacity=".15"/>
    <path d="M34 35h20v14H34z M39 30h10v5H39z" fill="#7dd3fc"/>
    <text x="78" y="48" class="label">Bee Adapter</text>
    <text x="26" y="84" class="sub">normalize + validate</text>
  </g>

  <!-- Engine -->
  <g transform="translate(585 145)" filter="url(#soft)">
    <rect class="box" width="235" height="120" rx="22"/>
    <circle cx="44" cy="42" r="21" fill="#8b5cf6" opacity=".16"/>
    <path d="M33 50l8-18 7 9 8-9 5 18z" fill="#a78bfa"/>
    <text x="80" y="48" class="label">Loop Engine</text>
    <text x="26" y="84" class="sub">detect + correlate</text>
  </g>

  <!-- Store -->
  <g transform="translate(855 145)" filter="url(#soft)">
    <rect class="box" width="220" height="120" rx="22"/>
    <ellipse cx="44" cy="34" rx="15" ry="7" fill="#34d399"/>
    <path d="M29 34v20c0 4 7 7 15 7s15-3 15-7V34c0 4-7 7-15 7s-15-3-15-7Z" fill="#10b981" opacity=".85"/>
    <text x="78" y="48" class="label">LoopStore</text>
    <text x="26" y="84" class="sub">local SQLite only</text>
  </g>

  <!-- Review -->
  <g transform="translate(1110 145)" filter="url(#soft)">
    <rect class="box" width="210" height="120" rx="22"/>
    <circle cx="44" cy="42" r="21" fill="#f43f5e" opacity=".14"/>
    <path d="M33 34h22v6H33zm0 10h16v6H33zm0 10h12v6H33z" fill="#fb7185"/>
    <text x="78" y="48" class="label">Review</text>
    <text x="26" y="84" class="sub">follow-through UI</text>
  </g>

  <!-- Authoritative moving signals -->
  <circle r="7" fill="#e0f2fe" filter="url(#glow)">
    <animateMotion dur="5.8s" repeatCount="indefinite">
      <mpath href="#authPath"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="#c4b5fd" opacity=".9">
    <animateMotion dur="5.8s" begin="-2.9s" repeatCount="indefinite">
      <mpath href="#authPath"/>
    </animateMotion>
  </circle>

  <!-- Realtime label -->
  <text x="70" y="335" class="small">PROVISIONAL REALTIME</text>
  <text x="70" y="365" class="sub">Fast awareness, memory-only, never direct persistence</text>

  <!-- realtime source -->
  <g transform="translate(85 350)" filter="url(#soft)">
    <rect class="box" width="210" height="95" rx="22"/>
    <circle cx="42" cy="40" r="18" fill="#22d3ee" opacity=".15" class="pulse"/>
    <path d="M31 45c7-12 15-18 22-18 0 15-8 26-22 33 3-6 4-10 0-15Z" fill="#67e8f9"/>
    <text x="73" y="45" class="label">Bee Realtime</text>
    <text x="26" y="73" class="sub">foreground stream</text>
  </g>

  <!-- provisional awareness -->
  <g transform="translate(370 350)" filter="url(#soft)">
    <rect class="box" width="260" height="95" rx="22"/>
    <circle cx="42" cy="40" r="18" fill="#34d399" opacity=".15" class="pulse"/>
    <path d="M32 40l7 7 14-17" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="45" class="label">ProvisionalAwareness</text>
    <text x="26" y="73" class="sub">bounded in-memory signals</text>
  </g>

  <!-- provisional UI -->
  <g transform="translate(705 350)" filter="url(#soft)">
    <rect class="box" width="280" height="95" rx="22"/>
    <circle cx="42" cy="40" r="18" fill="#14b8a6" opacity=".15" class="pulse"/>
    <path d="M32 31h20v22H32z M36 36h12v3H36zm0 7h12v3H36z" fill="#5eead4"/>
    <text x="75" y="45" class="label">PROVISIONAL UI</text>
    <text x="26" y="73" class="sub">sanitized + temporary</text>
  </g>

  <!-- shield -->
  <g transform="translate(1060 344)" filter="url(#soft)">
    <rect class="box" width="260" height="108" rx="22"/>
    <path d="M44 25l18 7v14c0 13-8 23-18 29-10-6-18-16-18-29V32z" fill="#1d4ed8" opacity=".55"/>
    <path d="M36 48l6 6 12-15" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="43" class="label">Privacy Boundary</text>
    <text x="80" y="68" class="sub">no raw transcript persistence</text>
    <text x="80" y="89" class="sub">no external LLM / telemetry</text>
  </g>

  <!-- moving provisional signals -->
  <circle r="6" fill="#99f6e4" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite">
      <mpath href="#provPath"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#67e8f9" opacity=".9">
    <animateMotion dur="4.2s" begin="-2.1s" repeatCount="indefinite">
      <mpath href="#provPath"/>
    </animateMotion>
  </circle>

  <!-- no-write indicator -->
  <path d="M985 390 C1030 390 1035 285 1075 255" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 9" opacity=".7"/>
  <circle cx="1040" cy="320" r="16" fill="#3f1420" stroke="#fb7185" stroke-width="2"/>
  <path d="M1032 312l16 16m0-16l-16 16" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
  <text x="1080" y="313" class="small">NO DIRECT WRITE</text>
</svg>